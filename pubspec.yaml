name: lodha_inspiro
description: A complete student portal and chat application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Your Database & Auth
  supabase_flutter: ^2.3.0

  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  camera: ^0.11.2+1
  flutter_screen_recording: ^2.0.25

  # Notebooks
  http: ^1.2.2
  file_picker: ^8.1.2
  flutter_tts: ^4.2.0
  uuid: ^4.5.1
  speech_to_text: ^7.4.0
  syncfusion_flutter_pdf: ^31.1.19

  # App update + Studio exports
  package_info_plus: ^8.3.1
  pdf: ^3.11.3
  archive: ^3.6.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
