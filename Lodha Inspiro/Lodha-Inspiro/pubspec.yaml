name: lodha_inspiro
description: A complete student portal and chat application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # 🚀 Your Database & Auth
  supabase_flutter: ^2.3.0
  
  # 🚀 Real-time Voice & Video Calling SDK
  # Remove zego_uikit_prebuilt_call and add this:
  agora_rtc_engine: ^6.5.4

  permission_handler: ^11.3.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # If you have images in the future
  # assets:
  #   - assets/images/

  # 🚀 Your custom font integration
  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf