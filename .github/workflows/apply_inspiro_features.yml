name: Apply Inspiro feature patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Inspiro AI and UX feature patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply feature patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, pattern, replacement, flags=re.S):
              p = Path(path)
              s = p.read_text()
              n, out = re.subn(pattern, replacement, s, count=1, flags=flags)
              if n:
                  p.write_text(out)
                  print('patched', path)
              else:
                  print('skip', path, 'pattern not found')

          # Groq web chat: GPT-OSS 120B stays the model, with Groq's built-in browser search when requested.
          p = Path('lib/gemini/gemini_service.dart')
          s = p.read_text()
          s = s.replace("      body: jsonEncode({\n        'model': model,", "      final requestBody = <String, dynamic>{\n        'model': model,")
          s = s.replace("        'temperature': 0.35,\n      }),\n    );", "        'temperature': 0.35,\n      };\n      if (webSearch) {\n        requestBody['tools'] = const [\n          {'type': 'browser_search'},\n        ];\n      }\n\n      final response = await http.post(\n      Uri.parse(GroqConfig.endpoint),\n      headers: {\n        'Authorization': 'Bearer ${GroqConfig.apiKey}',\n        'Content-Type': 'application/json',\n      },\n      body: jsonEncode(requestBody),\n    );") if "final requestBody" in s and "requestBody['tools']" not in s else s
          # The previous transformation leaves the original response declaration duplicated on some historical versions.
          s = re.sub(r"final requestBody = <String, dynamic>\{.*?final response = await http\.post\(\n      Uri\.parse\(GroqConfig\.endpoint\),\n      headers: \{\n        'Authorization': 'Bearer \$\{GroqConfig\.apiKey\}',\n        'Content-Type': 'application/json',\n      \},\n      body: jsonEncode\(requestBody\),\n    \);", lambda m: m.group(0), s, count=1, flags=re.S)
          p.write_text(s)

          # Home: replace the old Level Finder card with the real Groq AI chat surface.
          edit('lib/home_screen.dart', r"import 'app_preferences.dart';", "import 'app_preferences.dart';\nimport 'ai/inspiro_ai_screen.dart';\nimport 'gemini/gemini_service.dart';\nimport 'widgets/liquid_glass_background.dart';\nimport 'widgets/voice_text_button.dart';\nimport 'classroom/demo_classwork_screen.dart';")
          edit('lib/home_screen.dart', r"  bool _isLoadingChats = true;", "  bool _isLoadingChats = true;\n  final TextEditingController _homeAiController = TextEditingController();\n  final List<String> _homeAiMessages = [];\n  bool _homeAiSending = false;")
          edit('lib/home_screen.dart', r"  @override\n  void dispose\(\) \{", "  @override\n  void dispose() {\n    _homeAiController.dispose();", flags=re.S)
          insert_method = r'''\n  Future<void> _sendHomeAi() async {\n    final text = _homeAiController.text.trim();\n    if (text.isEmpty || _homeAiSending) return;\n    _homeAiController.clear();\n    setState(() {\n      _homeAiMessages.add('You: $text');\n      _homeAiSending = true;\n    });\n    try {\n      final answer = await GeminiService.instance.askGeneral(prompt: text);\n      if (!mounted) return;\n      setState(() {\n        _homeAiMessages.add('Inspiro AI: $answer');\n        _homeAiSending = false;\n      });\n    } on GeminiException catch (e) {\n      if (mounted) {\n        setState(() {\n          _homeAiMessages.add('Inspiro AI: ${e.message}');\n          _homeAiSending = false;\n        });\n      }\n    } catch (_) {\n      if (mounted) {\n        setState(() {\n          _homeAiMessages.add('Inspiro AI: Something went wrong.');\n          _homeAiSending = false;\n        });\n      }\n    }\n  }\n\n  void _showAnnouncements() {\n    final dark = Theme.of(context).brightness == Brightness.dark;\n    showModalBottomSheet<void>(\n      context: context,\n      backgroundColor: Colors.transparent,\n      isScrollControlled: true,\n      builder: (_) => Container(\n        padding: const EdgeInsets.fromLTRB(22, 14, 22, 28),\n        decoration: BoxDecoration(\n          color: dark ? const Color(0xFF101827) : Colors.white,\n          borderRadius: const BorderRadius.vertical(top: Radius.circular(32)),\n        ),\n        child: SafeArea(\n          top: false,\n          child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [\n            Center(child: Container(width: 42, height: 5, decoration: BoxDecoration(color: dark ? Colors.white24 : Colors.black12, borderRadius: BorderRadius.circular(10)))),\n            const SizedBox(height: 20),\n            const Text('Announcements', style: TextStyle(fontSize: 23, fontWeight: FontWeight.bold, fontFamily: 'Google Sans Flex')),\n            const SizedBox(height: 14),\n            _announcementTile('Welcome to Lodha Inspiro', 'Your AI study space, classroom and notebooks are ready.', dark),\n            _announcementTile('New: AI classwork', 'Create practice classwork from a notebook in Studio.', dark),\n            _announcementTile('Voice input', 'Tap the microphone in supported chats and speak. Your words become text before sending.', dark),\n          ]),\n        ),\n      ),\n    );\n  }\n\n  Widget _announcementTile(String title, String body, bool dark) => Container(\n    margin: const EdgeInsets.only(bottom: 10),\n    padding: const EdgeInsets.all(16),\n    decoration: BoxDecoration(\n      gradient: LinearGradient(colors: [const Color(0xFFBFE8FF).withOpacity(dark ? .18 : .5), const Color(0xFFD9D0FF).withOpacity(dark ? .12 : .42)]),\n      borderRadius: BorderRadius.circular(20),\n    ),\n    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n      Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontFamily: 'Google Sans Flex')),\n      const SizedBox(height: 5),\n      Text(body, style: TextStyle(color: dark ? Colors.white70 : Colors.black54, height: 1.35, fontFamily: 'Google Sans Flex')),\n    ]),\n  );\n'''
          edit('lib/home_screen.dart', r"  Widget _buildHomeScreenContent\(Size size, double padding, bool isDark\) \{.*?\n  Widget _buildClassworkScreenContent", insert_method + r'''\n  Widget _buildHomeScreenContent(Size size, double padding, bool isDark) {\n    final textColor = isDark ? Colors.white : const Color(0xFF172033);\n    return LiquidGlassBackground(\n      child: SingleChildScrollView(\n        key: const ValueKey(0),\n        padding: EdgeInsets.fromLTRB(padding, size.height * 0.02, padding, size.height * 0.22),\n        child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          _buildHeader('Inspiro', textColor),\n          SizedBox(height: size.height * 0.022),\n          Container(\n            width: double.infinity,\n            padding: const EdgeInsets.all(22),\n            decoration: BoxDecoration(\n              gradient: LinearGradient(colors: isDark ? const [Color(0xFF123B62), Color(0xFF283A7A)] : const [Color(0xFFBFE8FF), Color(0xFFD8D0FF)]),\n              borderRadius: BorderRadius.circular(30),\n              boxShadow: [BoxShadow(color: _accentBlue.withOpacity(.18), blurRadius: 28, offset: const Offset(0, 12))],\n            ),\n            child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n              Row(children: [\n                Container(width: 48, height: 48, decoration: BoxDecoration(color: Colors.white.withOpacity(.22), shape: BoxShape.circle), child: const Icon(Icons.auto_awesome_rounded, color: Colors.white)),\n                const SizedBox(width: 12),\n                const Expanded(child: Text('Ask Inspiro AI', style: TextStyle(color: Colors.white, fontSize: 21, fontWeight: FontWeight.bold, fontFamily: 'Google Sans Flex'))),\n                IconButton(onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const InspiroAiScreen())), icon: const Icon(Icons.open_in_new_rounded, color: Colors.white)),\n              ]),\n              const SizedBox(height: 10),\n              const Text('Ask homework questions, explain a topic, plan your study time or search the web when you need current information.', style: TextStyle(color: Colors.white, height: 1.35, fontFamily: 'Google Sans Flex')),\n              const SizedBox(height: 14),\n              if (_homeAiMessages.isNotEmpty)\n                Container(\n                  constraints: const BoxConstraints(maxHeight: 180),\n                  padding: const EdgeInsets.all(12),\n                  decoration: BoxDecoration(color: Colors.black.withOpacity(.12), borderRadius: BorderRadius.circular(18)),\n                  child: ListView.builder(shrinkWrap: true, itemCount: _homeAiMessages.length, itemBuilder: (_, i) => Padding(padding: const EdgeInsets.only(bottom: 7), child: Text(_homeAiMessages[i], style: const TextStyle(color: Colors.white, fontSize: 13, height: 1.35, fontFamily: 'Google Sans Flex')))),\n                ),\n              if (_homeAiMessages.isNotEmpty) const SizedBox(height: 10),\n              Container(\n                padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 4),\n                decoration: BoxDecoration(color: Colors.white.withOpacity(.9), borderRadius: BorderRadius.circular(24)),\n                child: Row(children: [\n                  Expanded(child: TextField(controller: _homeAiController, minLines: 1, maxLines: 4, onSubmitted: (_) => _sendHomeAi(), decoration: const InputDecoration(hintText: 'Ask anything...', border: InputBorder.none, contentPadding: EdgeInsets.symmetric(horizontal: 12)))),\n                  VoiceTextButton(controller: _homeAiController, accentColor: _accentBlue, enabled: !_homeAiSending),\n                  IconButton.filled(onPressed: _homeAiSending ? null : _sendHomeAi, icon: const Icon(Icons.arrow_upward_rounded)),\n                ]),\n              ),\n            ]),\n          ),\n          const SizedBox(height: 16),\n          Row(children: [\n            Expanded(child: _homeQuickCard('Demo classwork', Icons.assignment_rounded, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DemoClassworkScreen())), isDark)),\n            const SizedBox(width: 12),\n            Expanded(child: _homeQuickCard('Open AI chat', Icons.chat_bubble_rounded, () => Navigator.push(context, MaterialPageRoute(builder: (_) => const InspiroAiScreen())), isDark)),\n          ]),\n        ]),\n      ),\n    );\n  }\n\n  Widget _homeQuickCard(String title, IconData icon, VoidCallback onTap, bool dark) => GestureDetector(\n    onTap: onTap,\n    child: Container(\n      padding: const EdgeInsets.all(17),\n      decoration: BoxDecoration(gradient: LinearGradient(colors: dark ? const [Color(0xFF183A5C), Color(0xFF27366D)] : const [Color(0xFFE0F4FF), Color(0xFFEAE3FF)]), borderRadius: BorderRadius.circular(23)),\n      child: Row(children: [Icon(icon, color: _accentBlue), const SizedBox(width: 9), Expanded(child: Text(title, style: TextStyle(color: dark ? Colors.white : const Color(0xFF172033), fontWeight: FontWeight.w700, fontFamily: 'Google Sans Flex')))]),\n    ),\n  );\n\n  Widget _buildClassworkScreenContent''')
          edit('lib/home_screen.dart', r"onTap: \(\) => _showGlassSnackBar\('Announcements coming soon! 🚀'\),", "onTap: _showAnnouncements,")
          edit('lib/home_screen.dart', r"'chat_name': chatName,\n                'chat_type': typeStr,", "'chat_name': chatName,\n                'chat_type': typeStr,\n                'created_by': supabase.auth.currentUser?.id,\n                'user_email': _selectedChatTab == 2 ? null : supabase.auth.currentUser?.email,\n                'participant_email': _selectedChatTab == 2 ? null : email,")
          edit('lib/home_screen.dart', r"transitionsBuilder:\n                \(context, animation, secondaryAnimation, child\) \{\n                return FadeTransition\(opacity: animation, child: child\);\n              \},", "transitionsBuilder: (context, animation, secondaryAnimation, child) {\n                final curve = CurvedAnimation(parent: animation, curve: Curves.easeOutCubic);\n                return FadeTransition(opacity: curve, child: ScaleTransition(scale: Tween(begin: .94, end: 1.0).animate(curve), child: child));\n              },")

          # Chat screen: correct attachment ownership path and add voice-to-text.
          edit('lib/chat_screen.dart', r"import 'notification_service.dart';", "import 'notification_service.dart';\nimport 'widgets/voice_text_button.dart';")
          edit('lib/chat_screen.dart', r"final fileName = '\$\{DateTime.now\(\)\.millisecondsSinceEpoch\}_\$\{image\.name\}';", "final userId = supabase.auth.currentUser?.id;\n      if (userId == null) throw Exception('Not signed in');\n      final fileName = '$userId/${DateTime.now().millisecondsSinceEpoch}_${image.name}';")
          edit('lib/chat_screen.dart', r"IconButton\(icon: const Icon\(Icons.add_circle_outline_rounded\), color: isDark \? Colors.white70 : Colors.black54, iconSize: 28, onPressed: _isUploading \? null : _pickAndUploadAttachment\),", "IconButton(icon: const Icon(Icons.add_circle_outline_rounded), color: isDark ? Colors.white70 : Colors.black54, iconSize: 28, onPressed: _isUploading ? null : _pickAndUploadAttachment),")
          edit('lib/chat_screen.dart', r"Expanded\(\n        child: Container\(", "Expanded(\n        child: Container(")
          edit('lib/chat_screen.dart', r"const SizedBox\(width: 12\),\n                GestureDetector\(onTap: \(\) => _sendMessage\(\),", "const SizedBox(width: 4),\n                VoiceTextButton(controller: _messageController, accentColor: _accentBlue, enabled: !_isUploading),\n                const SizedBox(width: 4),\n                GestureDetector(onTap: () => _sendMessage(),")

          # General AI screen: voice input.
          edit('lib/ai/inspiro_ai_screen.dart', r"import '../notebooks/notebook_models.dart';", "import '../notebooks/notebook_models.dart';\nimport '../widgets/voice_text_button.dart';")
          edit('lib/ai/inspiro_ai_screen.dart', r"const SizedBox\(width: 8\),\n                  IconButton\.filled", "VoiceTextButton(controller: _controller, accentColor: const Color(0xFF32C5FF), enabled: !_sending),\n                  const SizedBox(width: 4),\n                  IconButton.filled")

          # Notebook detail: shared wallpaper, voice input and AI-generated classwork entry point.
          edit('lib/notebooks/notebook_detail_screen.dart', r"import 'note_export_service.dart';", "import 'note_export_service.dart';\nimport '../widgets/liquid_glass_background.dart';\nimport '../widgets/voice_text_button.dart';\nimport 'ai_classwork_screen.dart';")
          edit('lib/notebooks/notebook_detail_screen.dart', r"return Scaffold\(\n      backgroundColor:\n        isDark \? const Color\(0xFF121212\) : const Color\(0xFFEBF0F5\),", "return Scaffold(\n      backgroundColor: Colors.transparent,\n")
          edit('lib/notebooks/notebook_detail_screen.dart', r"      body: TabBarView\(\n        controller: _tabController,\n        children: \[", "      body: LiquidGlassBackground(child: TabBarView(\n        controller: _tabController,\n        children: [")
          edit('lib/notebooks/notebook_detail_screen.dart', r"          _buildStudioTab\(isDark, textColor\),\n        \],\n      \),", "          _buildStudioTab(isDark, textColor),\n        ],\n      )),")
          edit('lib/notebooks/notebook_detail_screen.dart', r"IconButton\(\n                  icon: const Icon\(Icons.send_rounded, color: _accentBlue\),", "VoiceTextButton(controller: _chatController, accentColor: _accentBlue, enabled: !_sendingMessage),\n                IconButton(\n                  icon: const Icon(Icons.send_rounded, color: _accentBlue),")
          edit('lib/notebooks/notebook_detail_screen.dart', r"const SizedBox\(height: 16\),\n        _buildStudioCard\(\n          isDark: isDark,\n          textColor: textColor,\n          icon: Icons\.podcasts_rounded,", "const SizedBox(height: 16),\n        _buildStudioCard(\n          isDark: isDark,\n          textColor: textColor,\n          icon: Icons.assignment_turned_in_rounded,\n          title: 'AI Classwork',\n          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n            Text('Let Inspiro AI turn this notebook into practice classwork that the student can complete.', style: TextStyle(color: isDark ? Colors.white70 : Colors.black87, fontFamily: 'Google Sans Flex', height: 1.4)),\n            const SizedBox(height: 12),\n            ElevatedButton.icon(style: ElevatedButton.styleFrom(backgroundColor: _accentBlue, foregroundColor: Colors.white), onPressed: _sources.isEmpty ? null : () => Navigator.push(context, MaterialPageRoute(builder: (_) => AiClassworkScreen(notebook: widget.notebook, sources: _sources))), icon: const Icon(Icons.auto_awesome_rounded), label: const Text('Create classwork')),\n          ]),\n        ),\n        const SizedBox(height: 16),\n        _buildStudioCard(\n          isDark: isDark,\n          textColor: textColor,\n          icon: Icons.podcasts_rounded,")
          edit('lib/notebooks/notebook_detail_screen.dart', r"Something went wrong reaching Gemini", "Something went wrong reaching Groq")
          edit('lib/notebooks/notebook_detail_screen.dart', r"Ask Gemini anything", "Ask Inspiro AI anything")
          edit('lib/notebooks/notebook_detail_screen.dart', r"Generate a two-host discussion", "Generate a two-host discussion")

          # Notebook list uses the same shared wallpaper.
          edit('lib/notebooks/notebooks_list_screen.dart', r"import 'notebook_repository.dart';", "import 'notebook_repository.dart';\nimport '../widgets/liquid_glass_background.dart';")
          edit('lib/notebooks/notebooks_list_screen.dart', r"body: Stack\(", "body: LiquidGlassBackground(child: Stack(")
          edit('lib/notebooks/notebooks_list_screen.dart', r"        \],\n      \),\n    \);\n  \}\n\n  Widget _glow", "        ],\n      )),\n    );\n  }\n\n  Widget _glow")

          # Classroom: add an always-available local demo entry when no live classes exist.
          edit('lib/classroom/classroom_screen.dart', r"else if \(_courses\.isEmpty\)\n            _emptyState\(\n              isDark,\n              Icons\.school_outlined,\n              'No classes have been added yet\.',\n              null,\n              null,\n            \)", "else if (_courses.isEmpty) ...[\n            _emptyState(isDark, Icons.school_outlined, 'No classes have been added yet.', null, null),\n            const SizedBox(height: 8),\n            _demoClassworkCard(isDark, textColor),\n          ]")
          edit('lib/classroom/classroom_screen.dart', r"  Widget _emptyState\(", r'''  Widget _demoClassworkCard(bool isDark, Color textColor) => GestureDetector(\n    onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const DemoClassworkScreen())),\n    child: Container(\n      padding: const EdgeInsets.all(18),\n      decoration: BoxDecoration(gradient: LinearGradient(colors: isDark ? const [Color(0xFF153A5D), Color(0xFF293B78)] : const [Color(0xFFDFF5FF), Color(0xFFEDE5FF)]), borderRadius: BorderRadius.circular(24)),\n      child: Row(children: [\n        Container(width: 50, height: 50, decoration: BoxDecoration(color: _accentBlue.withOpacity(.16), shape: BoxShape.circle), child: const Icon(Icons.play_arrow_rounded, color: _accentBlue)),\n        const SizedBox(width: 14),\n        Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [\n          Text('Demo Classwork', style: TextStyle(color: textColor, fontWeight: FontWeight.bold, fontSize: 17, fontFamily: 'Google Sans Flex')),\n          const SizedBox(height: 4),\n          Text('Test the student assignment experience without a live class.', style: TextStyle(color: isDark ? Colors.white60 : Colors.black54, fontSize: 12.5, fontFamily: 'Google Sans Flex')),\n        ])),\n        Icon(Icons.chevron_right_rounded, color: isDark ? Colors.white54 : Colors.black38),\n      ]),\n    ),\n  );\n\n  Widget _emptyState(''')
          edit('lib/classroom/classroom_screen.dart', r"import 'classwork_session_screen.dart';", "import 'classwork_session_screen.dart';\nimport 'demo_classwork_screen.dart';")

          # Remove obsolete workflow after this one-shot patch.
          wf = Path('.github/workflows/apply_inspiro_features.yml')
          if wf.exists(): wf.unlink()
          
          changed = []
          for path in ['lib/gemini/gemini_service.dart','lib/home_screen.dart','lib/chat_screen.dart','lib/ai/inspiro_ai_screen.dart','lib/notebooks/notebook_detail_screen.dart','lib/notebooks/notebooks_list_screen.dart','lib/classroom/classroom_screen.dart']:
              if Path(path).exists(): changed.append(path)
          print('feature patch touched:', changed)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Apply Inspiro AI and UX feature patch'
          git push
